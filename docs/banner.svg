<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b2a86"/>
      <stop offset="0.5" stop-color="#2a4fa8"/>
      <stop offset="1" stop-color="#0f8f9c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="230" cy="60" r="120" fill="#ff6fb1" opacity="0.55" filter="url(#blur)"/>
  <circle cx="1020" cy="260" r="140" fill="#5ff2d6" opacity="0.45" filter="url(#blur)"/>
  <!-- glass recording pill -->
  <rect x="70" y="100" width="300" height="100" rx="50" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="122" cy="150" r="20" fill="#ff3b30"/>
  <circle cx="122" cy="150" r="30" fill="none" stroke="#ff3b30" stroke-opacity="0.45" stroke-width="3"/>
  <text x="168" y="162" font-family="Segoe UI, SF Pro Display, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#ffffff">00:42</text>
  <rect x="290" y="132" width="10" height="36" rx="3" fill="#ffffff"/>
  <rect x="308" y="132" width="10" height="36" rx="3" fill="#ffffff"/>
  <text x="430" y="150" font-family="Segoe UI, SF Pro Display, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#ffffff">GlassRecorder</text>
  <text x="432" y="198" font-family="Segoe UI, SF Pro Display, Helvetica, Arial, sans-serif" font-size="26" fill="#e6ecff" opacity="0.9">iOS-style glass screen recorder for Windows 11</text>
</svg>
